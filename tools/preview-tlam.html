<h1>미리보기 — T(λ) 곡선 <span class="sub">설계 §8-4 · 실제 계산 (더미 데이터 아님)</span></h1>

<div class="card" id="cardB"></div>

<div class="card">
  <h2>부하 실측 <span class="sub">— 브라우저 표시 상태 (설계 §15-20)</span></h2>
  <p class="note">§9-4 의 <code>MoM 33 ms</code> · <code>하위헌스 328~369 ms</code> 는
    <b>Node 격리 값</b>입니다. 상수배로 환산하지 않고 여기서 브라우저 표시 상태로 다시 잽니다.</p>
  <table class="perf" id="perf"><tbody></tbody></table>

<script src="../shared/floquet-ref.js"></script>
<script src="../shared/mom-ref.js"></script>
<script src="../huygens/physics.js"></script>
<script>
(function () {
  "use strict";

  const REF = window.FloquetRef;      // T_inf_grid
  const MOM = window.MomRef;          // T_fin_grid
  const HP = window.HuygensPhysics;   // T_inf_huygens · T_fin_huygens

  // ── 토글 ────────────────────────────────────────────────────────────
  // 논문 그림 캡처 모드. DRAW_BAND_TITLES 와 같은 방식이다 (설계 §15-16).
  // 기본 false — 화면에서는 캔버스 밖 HTML 범례가 읽기 좋다. true 면 범례·정의·경고를
  // 캔버스 안에 그려 캔버스 하나만 캡처해도 그림이 완결된다.
  let LEGEND_IN_CANVAS = false;

  const Y_MAX_PCT = 120;   // y 상한 고정. 유한 곡선 최대 119.0 % 가 안에 들어온다.

  // ── 스캔 격자 (§8-4) ────────────────────────────────────────────────
  const LAM_INF = [];   // 0.1 cm 간격 · 291점 — 해석식이라 즉시
  for (let i = 0; i < 291; i++) LAM_INF.push(+(1 + i * 0.1).toFixed(1));
  const LAM_FIN = [];   // 0.5 cm 간격 · 59점 — 수치
  for (let i = 0; i < 59; i++) LAM_FIN.push(+(1 + i * 0.5).toFixed(1));

  // ── 곡선 정의 (§8-4 표) ────────────────────────────────────────────
  // 색은 모형으로, 선 종류는 무한/유한으로 가른다.
  //   실제(격자) = 파랑    하위헌스 = 주황
  //   무한 = 실선(진한 색)  유한 = 점선(연한 색)
  // 점선 틈을 넓게 잡아 아래 실선이 보이게 한다 — λ>d 에서 두 하위헌스 곡선은 겹친다.
  const STYLE = {
    infGrid: { color: "#12508f", dash: [],     w: 2.2, label: "무한·실제 (Floquet)" },
    infHuy:  { color: "#b3400e", dash: [],     w: 2.2, label: "무한·하위헌스" },
    finGrid: { color: "#5b9de8", dash: [7, 5], w: 2.6, label: "유한·실제 (MoM)" },
    finHuy:  { color: "#f0a15e", dash: [7, 5], w: 2.6, label: "유한·하위헌스 (RS)" },
  };
  const ORDER = ["infGrid", "infHuy", "finGrid", "finHuy"];

  // gap 판정 — **무한·실제(Floquet) 곡선에만** 적용한다.
  //   무손실 격자의 전력 투과율은 1 을 넘을 수 없다. λ < d 의 다중 전파차수 구간에서
  //   floquetZ 의 1/κ 가 커져 T > 1 이 나오는데, 이는 물리가 아니라 수치 인공물이다.
  //   그대로 그리면 독자가 물리로 읽으므로 곡선을 끊는다. 값은 버리지 않는다(CSV·진단).
  //
  //   유한 곡선에는 **절대 적용하지 않는다.** 유한 T 는 전력 유속이 아니라 측정창
  //   평균 |E|² 이므로 간섭으로 1 을 넘는 것이 물리다 (설계 §8-3 의 정의 분리).
  const GAP_KEY = "infGrid";
  function isGap(p) { return p.T > 1; }

  const M = { l: 78, r: 18, t: 20, b: 62 };   // 플롯 여백 (하: 축라벨 + d/λ 눈금)

  // ── 그리기 ──────────────────────────────────────────────────────────
  function draw(cv, st, c) {
    const dpr = window.devicePixelRatio || 1;
    // 범례를 캔버스 안에 넣을 때는 **캔버스를 아래로 늘려** 축 밑에 띠를 만든다.
    // 플롯 영역은 두 모드에서 완전히 같다 — 곡선이 범례에 가려지는 일이 없고,
    // 두 모드의 그림을 겹쳐 비교할 수 있다.
    const PLOT_H = 430;
    const legendH = LEGEND_IN_CANVAS ? 128 : 0;
    const W = cv.clientWidth, H = PLOT_H + legendH;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    cv.style.height = H + "px";
    const g = cv.getContext("2d");
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    g.fillStyle = "#fff"; g.fillRect(0, 0, W, H);

    const x0 = M.l, x1 = W - M.r, y0 = M.t, y1 = PLOT_H - M.b;
    const lamMin = 1, lamMax = 30;
    // yMax 는 **퍼센트** 단위이고 곡선 T 는 **분수**다. py 에서 단위를 맞춘다.
    const px = (lam) => x0 + (lam - lamMin) / (lamMax - lamMin) * (x1 - x0);
    const py = (T) => y1 - (T * 100 / Y_MAX_PCT) * (y1 - y0);

    // 현재 λ 세로 표시선 — **곡선보다 먼저** 그린다. 위에 그리면 곡선을 가린다.
    const mx = px(st.lam);
    g.save();
    g.strokeStyle = "#b9c2cc"; g.lineWidth = 1; g.setLineDash([4, 3]);
    g.beginPath(); g.moveTo(mx, y0); g.lineTo(mx, y1); g.stroke();
    g.restore();

    // 격자·축
    g.save();
    g.strokeStyle = "#e8ecf1"; g.lineWidth = 1;
    g.fillStyle = "#5b6672"; g.font = "12px 'Malgun Gothic', sans-serif";
    for (let t = 0; t <= Y_MAX_PCT + 1e-9; t += 20) {
      const y = py(t / 100);
      g.beginPath(); g.moveTo(x0, y); g.lineTo(x1, y); g.stroke();
      g.textAlign = "right"; g.textBaseline = "middle";
      g.fillText(t + " %", x0 - 8, y);
    }
    g.textAlign = "center"; g.textBaseline = "top";
    for (const lam of [1, 5, 10, 15, 20, 25, 30]) {
      const x = px(lam);
      g.beginPath(); g.moveTo(x, y0); g.lineTo(x, y1); g.stroke();
      g.fillText(String(lam), x, y1 + 7);
    }
    g.strokeStyle = "#9aa5b1"; g.lineWidth = 1.2;
    g.beginPath(); g.moveTo(x0, y0); g.lineTo(x0, y1); g.lineTo(x1, y1); g.stroke();
    g.restore();

    // d/λ 정수 눈금 (Rayleigh 파장) — 축 아래에 ▾ 와 정수값
    g.save();
    g.fillStyle = "#8a6a2a"; g.font = "11px 'Malgun Gothic', sans-serif";
    g.textAlign = "center"; g.textBaseline = "top";
    rayleighLams(c.d).forEach(function (r) {
      const x = px(r.lam);
      g.beginPath(); g.moveTo(x - 4, y1 + 20); g.lineTo(x + 4, y1 + 20); g.lineTo(x, y1 + 26);
      g.closePath(); g.fill();
      g.fillText(String(r.n), x, y1 + 27);
    });
    g.restore();

    // 축 라벨 (한국어 — §8-4)
    g.save();
    g.fillStyle = "#1b1f24"; g.font = "13px 'Malgun Gothic', sans-serif";
    g.textAlign = "center"; g.textBaseline = "top";
    g.fillText("파장 λ [cm]", (x0 + x1) / 2, y1 + 42);
    g.translate(16, (y0 + y1) / 2); g.rotate(-Math.PI / 2);
    g.fillText("투과율 T [%]", 0, 0);
    g.restore();

    // 곡선 — 무한(실선) 먼저, 유한(점선) 을 위에
    for (const key of ORDER) {
      const pts = st.curves[key];
      if (!pts || !pts.length) continue;
      const s = STYLE[key];
      g.save();
      g.strokeStyle = s.color; g.lineWidth = s.w; g.setLineDash(s.dash);
      g.lineJoin = "round"; g.lineCap = "round";
      g.beginPath();
      let pen = false;
      for (const p of pts) {
        if (key === GAP_KEY && isGap(p)) { pen = false; continue; }   // 끊는다
        const X = px(p.lam), Y = py(p.T);
        if (!pen) { g.moveTo(X, Y); pen = true; } else g.lineTo(X, Y);
      }
      g.stroke();
      g.restore();
    }

    // 표시선 라벨 — 곡선 위가 아니라 플롯 상단에 둔다
    g.save();
    g.fillStyle = "#5b6672"; g.font = "12px 'Malgun Gothic', sans-serif";
    g.textBaseline = "top";
    g.textAlign = mx > (x0 + x1) / 2 ? "right" : "left";
    g.fillText("현재 λ = " + st.lam.toFixed(1) + " cm", mx + (mx > (x0 + x1) / 2 ? -6 : 6), y0 + 2);
    g.restore();

    if (LEGEND_IN_CANVAS) drawLegend(g, c, x0, x1, PLOT_H);
  }

  // 캔버스 안 범례 (LEGEND_IN_CANVAS = true). 논문 캡처용 — 캔버스 하나로 그림이 완결된다.
  // 축 아래 별도 띠에 놓는다. 플롯 안에 넣으면 조건 A 는 하위헌스 곡선(81 %)이, 조건 B 는
  // 실제 곡선의 감쇠 꼬리가 걸린다 — 7줄짜리 정의 범례가 들어갈 빈 띠가 없다.
  function drawLegend(g, c, x0, x1, top) {
    const lines = [
      { k: "infGrid" }, { k: "infHuy" },
      { d: "무한 곡선 정의 — 전파 회절차수 전력합  T = Σ(κ_m/k)|t_m|²" },
      { k: "finGrid", s: " · N = " + c.N }, { k: "finHuy", s: " · N = " + c.N },
      { d: "유한 곡선 정의 — x = 30 mm · 반높이 22.5 mm · 41 표본 평균 |E|²" },
      { w: "두 정의는 서로 다릅니다 — 직접 비교하지 마십시오" },
    ];
    const lh = 16, padX = 10, padY = 8;
    const bw = x1 - x0, bh = lines.length * lh + padY * 2;
    const bx = x0, by = top - 4;

    g.save();
    g.strokeStyle = "#dde2e8"; g.lineWidth = 1;
    g.beginPath(); g.moveTo(bx, by); g.lineTo(bx + bw, by); g.stroke();
    g.textBaseline = "middle";
    lines.forEach(function (ln, i) {
      const y = by + padY + i * lh + lh / 2;
      if (ln.k) {
        const s = STYLE[ln.k];
        g.save();
        g.strokeStyle = s.color; g.lineWidth = s.w; g.setLineDash(s.dash);
        g.beginPath(); g.moveTo(bx + padX, y); g.lineTo(bx + padX + 30, y); g.stroke();
        g.restore();
        g.fillStyle = "#1b1f24"; g.font = "12px 'Malgun Gothic', sans-serif";
        g.textAlign = "left"; g.fillText(s.label + (ln.s || ""), bx + padX + 38, y);
      } else if (ln.d) {
        g.fillStyle = "#5b6672"; g.font = "11px 'Malgun Gothic', sans-serif";
        g.textAlign = "left"; g.fillText(ln.d, bx + padX + 4, y);
      } else {
        g.fillStyle = "#a13a1c"; g.font = "bold 11.5px 'Malgun Gothic', sans-serif";
        g.textAlign = "left"; g.fillText(ln.w, bx + padX + 4, y);
      }
    });
    g.restore();
  }

  // d/λ 가 정수인 λ (스캔 범위 안). d 는 mm.
  function rayleighLams(d_mm) {
    const out = [];
    for (let n = 1; n <= 60; n++) {
      const lam = (d_mm / 10) / n;
      if (lam >= 1 && lam <= 30) out.push({ n: n, lam: lam });
    }
    return out;
  }

  // ── 계산 ────────────────────────────────────────────────────────────
  function computeInfinite(c) {
    const t0 = performance.now();
    const infGrid = LAM_INF.map(function (lam) {
      const r = REF.T_inf_grid(lam, c.d, c.a);
      return { lam: lam, T: r.T, R: r.R, TR: r.T + r.R };
    });
    const tA = performance.now();
    const infHuy = LAM_INF.map((lam) => ({ lam: lam, T: HP.T_inf_huygens(lam, c.d, c.a).T }));
    const tB = performance.now();

    // [기록] T+R 이탈. **판정이 아니다 — 임계를 두지 않는다.**
    // Rayleigh 지표가 아니라 floquetZ 임피던스 시트 근사의 충실도 지표다 (설계 §14-7).
    let mx = 0, mxLam = 0, lo5 = Infinity, hi5 = 0;
    for (const p of infGrid) {
      const dev = Math.abs(p.TR - 1);
      if (dev > mx) { mx = dev; mxLam = p.lam; }
      if (p.lam >= 5) { lo5 = Math.min(lo5, dev); hi5 = Math.max(hi5, dev); }
    }
    const gapped = infGrid.filter(isGap);
    return { infGrid, infHuy, msGrid: tA - t0, msHuy: tB - tA,
             tr: { max: mx, maxLam: mxLam, lo5: lo5, hi5: hi5 }, gapped: gapped };
  }

  // 유한 곡선은 무겁다. 16 ms 마다 페인트를 양보해 진행 표시가 실제로 갱신되게 한다.
  // 취소 토큰을 받는다 — 계산 중 조건이 바뀌면 이전 계산을 버린다.
  function yieldPaint() {
    return new Promise(function (r) {
      let done = false;
      const run = () => { if (!done) { done = true; r(); } };
      requestAnimationFrame(run);
      setTimeout(run, 250);      // 숨은 탭 대비 (설계 §10-2 5-2)
    });
  }

  async function computeFinite(c, token, onProgress) {
    const finGrid = [], finHuy = [];
    let msGrid = 0, msHuy = 0;
    const wall0 = performance.now();
    let slice = performance.now();
    for (let i = 0; i < LAM_FIN.length; i++) {
      if (token.cancelled) return null;
      const lam = LAM_FIN[i];
      const t = performance.now();
      finGrid.push({ lam: lam, T: MOM.T_fin_grid(lam, c.d, c.a, c.N) });
      const t2 = performance.now(); msGrid += t2 - t;
      finHuy.push({ lam: lam, T: HP.T_fin_huygens(lam, c.d, c.a, c.N) });
      msHuy += performance.now() - t2;
      if (performance.now() - slice > 16) {
        onProgress(i + 1, LAM_FIN.length);
        await yieldPaint();
        slice = performance.now();
      }
    }
    onProgress(LAM_FIN.length, LAM_FIN.length);
    return { finGrid, finHuy, msGrid, msHuy, wall: performance.now() - wall0 };
  }

  // ── 카드 조립 ───────────────────────────────────────────────────────
  function legendHTML(c) {
    const row = (k, extra) => '<div class="lg"><span class="swatch" style="border-top:' +
      STYLE[k].w + 'px ' + (STYLE[k].dash.length ? 'dashed' : 'solid') + ' ' + STYLE[k].color +
      '"></span><span>' + STYLE[k].label + (extra || '') + '</span></div>';
    return row('infGrid') + row('infHuy') +
      '<div class="lgdef">무한 곡선 정의 — 전파 회절차수 전력합 ' +
        '<code>T = Σ(κ_m/k)|t_m|²</code></div>' +
      row('finGrid', ' · N = ' + c.N) + row('finHuy', ' · N = ' + c.N) +
      '<div class="lgdef">유한 곡선 정의 — <code>x = 30 mm</code>, 측정창 반높이 ' +
        '<code>22.5 mm</code>, <code>41</code> 표본 평균 <code>|E|²</code> · ' +
        '도선당 적분 표본 <code>' + HP.T_NS_FIXED + '</code> 고정</div>' +
      '<p class="caution">두 정의는 서로 다릅니다 — 무한 곡선과 유한 곡선을 직접 비교하지 마십시오</p>';
  }

  function makeCard(el, c) {
    const rl = rayleighLams(c.d);
    el.innerHTML =
      '<h2>' + c.title + ' <span class="sub">— d = ' + c.d + ' mm · a = ' + c.a +
        ' mm · N = ' + c.N + '</span></h2>' +
      '<canvas></canvas>' +
      '<div class="ctl">' +
        '<label>현재 λ</label><input type="range" min="1" max="30" step="0.1" value="' + c.lam + '">' +
        '<span class="valbox"></span>' +
        '<button>유한 곡선 다시 계산</button>' +
        '<label class="chk"><input type="checkbox" class="legToggle">' +
          '<code>LEGEND_IN_CANVAS</code> (논문 캡처용)</label>' +
      '</div>' +
      '<div class="prog" hidden><span>유한 곡선 계산 중…</span>' +
        '<span class="bar"><i></i></span><span class="pct"></span></div>' +
      '<div class="legend">' + legendHTML(c) + '</div>' +

      // ── 캡션 (§8-4) ──
      '<p class="cap"><b>하위헌스 곡선은 λ > d 구간에서 <code>(1−2a/d)²</code> 로 ' +
        '평탄합니다. 장애물 모형만으로는 파장 의존적 차폐가 나오지 않습니다.</b></p>' +
      '<p class="cap">두 하위헌스 곡선이 겹치는 것은 λ > d 에서 <b>유한 배열이 무한 배열과 ' +
        '같은 값을 준다</b>는 뜻입니다 (게이트 7 실측 최대 편차 1.4 %p).</p>' +
      '<p class="cap">무손실 격자의 전력 투과율은 1 을 넘을 수 없습니다. ' +
        '<b>λ &lt; d 의 다중 전파차수 구간</b>에서 Floquet 해가 수치적으로 ' +
        '<code>T &gt; 100 %</code> 를 내는 점은 <b>곡선에서 끊었습니다</b>. ' +
        '값은 버리지 않고 CSV 와 아래 진단에 남습니다. x 축 아래 ▾ 와 숫자는 ' +
        '<code>d/λ</code> 가 정수인 <b>Rayleigh 파장</b>입니다' +
        (rl.length ? ' (' + rl.map((r) => 'λ=' + r.lam.toFixed(1) + '→' + r.n).join(' · ') + ').' : '.') +
        '</p>' +
      '<div class="rec" id="rec"></div>';

    const cv = el.querySelector("canvas");
    const slider = el.querySelector("input[type=range]");
    const val = el.querySelector(".valbox");
    const btn = el.querySelector("button");
    const legToggle = el.querySelector(".legToggle");
    const legendBox = el.querySelector(".legend");
    const prog = el.querySelector(".prog");
    const bar = el.querySelector(".bar > i");
    const pct = el.querySelector(".pct");
    const rec = el.querySelector(".rec");

    const st = { lam: c.lam, curves: {} };
    let token = { cancelled: false };

    function redraw() {
      val.textContent = st.lam.toFixed(1) + " cm";
      legendBox.hidden = LEGEND_IN_CANVAS;
      draw(cv, st, c);
    }

    slider.addEventListener("input", function () { st.lam = parseFloat(this.value); redraw(); });
    legToggle.addEventListener("change", function () {
      LEGEND_IN_CANVAS = this.checked;
      document.querySelectorAll(".legToggle").forEach((t) => { t.checked = LEGEND_IN_CANVAS; });
      document.querySelectorAll(".card").forEach((x) => { if (x.__redraw) x.__redraw(); });
    });
    el.__redraw = redraw;

    async function runFinite() {
      token.cancelled = true;                 // 진행 중이던 계산을 버린다
      const my = token = { cancelled: false };
      btn.disabled = true;
      prog.hidden = false; bar.style.width = "0%"; pct.textContent = "0 / " + LAM_FIN.length;
      await yieldPaint();                     // 표시가 실제로 그려진 뒤 계산에 들어간다
      const r = await computeFinite(c, my, function (i, n) {
        bar.style.width = (i / n * 100).toFixed(0) + "%";
        pct.textContent = i + " / " + n;
      });
      if (!r) return;                          // 취소됨
      st.curves.finGrid = r.finGrid; st.curves.finHuy = r.finHuy;
      redraw();
      prog.hidden = true; btn.disabled = false;
      perfRow(c.short + " · 유한·실제 (MoM)", r.msGrid, "");
      perfRow(c.short + " · 유한·하위헌스 (RS)", r.msHuy, "");
      perfRow(c.short + " · 유한 두 곡선 벽시계", r.wall, "진행 표시 양보 포함");
    }
    btn.addEventListener("click", runFinite);

    // 무한 곡선은 즉시
    const inf = computeInfinite(c);
    st.curves.infGrid = inf.infGrid; st.curves.infHuy = inf.infHuy;
    redraw();
    perfRow(c.short + " · 무한·실제 (Floquet, 291점)", inf.msGrid, "");
    perfRow(c.short + " · 무한·하위헌스 (291점)", inf.msHuy, "");

    rec.innerHTML =
      '<b>[기록] 판정 아님 — 임계 없음.</b> ' +
      '<code>|T+R−1|</code> 전 구간 최대 <b>' + inf.tr.max.toFixed(4) + '</b> (λ=' +
        inf.tr.maxLam.toFixed(1) + ' cm) · λ ≥ 5 cm 구간 ' + inf.tr.lo5.toFixed(4) + ' ~ ' +
        inf.tr.hi5.toFixed(4) + '. ' +
      '이 값은 <b>Rayleigh 지표가 아니라</b> <code>floquetZ</code> 임피던스 시트 근사의 ' +
      '충실도 지표이며 <code>a/d</code> 에 계통적으로 의존합니다 (설계 §14-7).<br>' +
      '<b>끊은 점 (T &gt; 100 %):</b> ' +
      (inf.gapped.length
        ? inf.gapped.map((p) => 'λ=' + p.lam.toFixed(1) + ' → ' + (p.T * 100).toFixed(1) + ' %').join(' · ') +
          ' <b>(' + inf.gapped.length + '점)</b>'
        : '<b>없음 (0점)</b>');

    return runFinite;
  }

  // ── 부하 표 ─────────────────────────────────────────────────────────
  const tbody = document.querySelector("#perf tbody");
  tbody.innerHTML = "<tr><th>항목</th><th>소요</th><th>비고</th></tr>";
  function perfRow(name, ms, note) {
    const tr = document.createElement("tr");
    tr.innerHTML = "<td>" + name + "</td><td>" + ms.toFixed(1) + " ms</td><td>" + note + "</td>";
    tbody.appendChild(tr);
  }

  // ── 시작 ────────────────────────────────────────────────────────────
  const visNote = document.getElementById("visNote");
  function updateVis() {
    const ok = document.visibilityState === "visible";
    visNote.innerHTML = ok
      ? '표시 상태 <code>visible</code> — 아래 부하 실측은 판정에 쓸 수 있습니다.'
      : '<span class="warn">⚠ 표시 상태가 아닙니다 (<code>' + document.visibilityState +
        '</code>) — 부하 실측을 쓰지 마십시오. 설계 §15-20.</span>';
  }
  updateVis();
  document.addEventListener("visibilitychange", updateVis);

  const CONDS = [
    { title: "조건 A — 기본", short: "A", d: 10, a: 0.5, N: 30, lam: 12.2 },
    { title: "조건 B — 구분이 어려울 만한 조건", short: "B", d: 30, a: 3, N: 30, lam: 12.2 },
  ];

  (async function () {
    const runA = makeCard(document.getElementById("cardA"), CONDS[0]);
    const runB = makeCard(document.getElementById("cardB"), CONDS[1]);
    await runA();          // 조건을 겹쳐 돌리지 않는다 — V8 최적화 해제로 부하가 왜곡된다 (§9-4)
    await runB();
  })();
})();
</script>
</body>
</html>
