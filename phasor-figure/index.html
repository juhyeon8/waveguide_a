<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>phasor-figure — 논문 그림 캡처</title>
<link rel="stylesheet" href="style.css"></head><body>

<section id="controlBar" class="controlbar">
  <div class="ctl">
    <label for="lamSlider">λ <span class="val" id="lamVal">60 mm</span></label>
    <input type="range" id="lamSlider" min="10" max="300" step="1" value="60">
  </div>
  <div class="ctl">
    <label for="dSlider">d <span class="val" id="dVal">15 mm</span></label>
    <input type="range" id="dSlider" min="1" max="60" step="1" value="15">
  </div>
  <div class="ctl">
    <label for="lSlider">L <span class="val" id="lVal">1.00 m</span></label>
    <input type="range" id="lSlider" min="0.3" max="3" step="0.01" value="1">
  </div>
  <div class="ctl">
    <label for="nSlider">N <span class="val" id="nVal">5</span></label>
    <input type="range" id="nSlider" min="1" max="200" step="1" value="5">
  </div>
  <div class="ctl" id="styleWrap">
    <label>위상자 표현</label>
    <div id="styleBtns" class="segbtns">
      <button type="button" data-style="spiral" class="active">나선</button>
      <button type="button" data-style="B">B(선분화살표)</button>
      <button type="button" data-style="A">A(다발)</button>
    </div>
  </div>
  <div class="ctl" id="scaleWrap">
    <label>캡처 해상도</label>
    <div id="scaleBtns" class="segbtns">
      <button type="button" data-scale="1">1×</button>
      <button type="button" data-scale="2" class="active">2×</button>
      <button type="button" data-scale="3">3×</button>
    </div>
  </div>
  <div class="ctl">
    <label>&nbsp;</label>
    <button type="button" id="captureBtn" class="captureBtn">캡처 (PNG 저장)</button>
  </div>
</section>

<section id="panel2" class="stage">
  <div class="col"><canvas id="canvas2L" width="620" height="640"></canvas></div>
  <div class="col"><canvas id="canvas2C" width="620" height="640"></canvas></div>
  <div class="col"><canvas id="canvas2R" width="620" height="640"></canvas></div>
</section>

<script src="script.js"></script></body></html>
