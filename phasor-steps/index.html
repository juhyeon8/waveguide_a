<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>층 1+다리 — 3단계 (v6)</title>
<link rel="stylesheet" href="style.css"></head><body>
<div id="gateBadge" class="badge">…</div>
<details id="gateDetails"><summary>자가 테스트 로그</summary>
<pre id="gateLog"></pre></details>

<section id="controlBar" class="controlbar">
  <div class="ctl">
    <label for="lamSlider">λ <span class="val" id="lamVal">60 mm</span></label>
    <input type="range" id="lamSlider" min="10" max="300" step="1" value="60">
  </div>
  <div class="ctl">
    <label for="dSlider">d <span class="val" id="dVal">3 mm</span></label>
    <input type="range" id="dSlider" min="1" max="60" step="1" value="3">
  </div>
  <div class="ctl static">a = 0.5 mm 고정</div>
  <div class="ldBig" id="ldBig">λ/d = 20.0</div>
  <div class="ctl" id="nWrap">
    <label for="nSlider">N <span class="val" id="nVal">200</span></label>
    <input type="range" id="nSlider" min="1" max="500" step="1" value="200">
  </div>
  <div class="ctl" id="lWrap" hidden>
    <label for="lSlider">L <span class="val" id="lVal">1.00 m</span></label>
    <input type="range" id="lSlider" min="0.3" max="3" step="0.01" value="1">
  </div>
  <div class="nav">
    <button type="button" id="prevBtn">이전</button>
    <span id="stepVal">1/3</span>
    <button type="button" id="nextBtn">다음</button>
  </div>
</section>

<section id="panel1" class="stage"><div class="col"><canvas id="canvas1L" width="620" height="640"></canvas></div>
  <div class="col"><canvas id="canvas1R" width="620" height="640"></canvas></div></section>
<section id="panel2" class="stage" hidden><div class="col"><canvas id="canvas2L" width="620" height="640"></canvas></div>
  <div class="col"><canvas id="canvas2R" width="620" height="640"></canvas></div></section>
<section id="panel3" class="stage" hidden><canvas id="canvas3" width="1000" height="720"></canvas></section>

<script src="script.js"></script></body></html>
</content>
